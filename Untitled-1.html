<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kalp Çizimi</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2 - 20;
    const scale = Math.min(canvas.width, canvas.height) / 45;

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";

    let i = 0;
    const totalSteps = 320;

    function drawStep() {
      if (i >= totalSteps) return;

      const a = (2 * Math.PI * i) / totalSteps;
      const xo = 16 * Math.pow(Math.sin(a), 3) * 16;
      const yo = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * 16;

      const L = Math.random() * (0.5 - 0.15) + 0.15;
      const xi = xo * (1 - L);
      const yi = yo * (1 - L);

      for (let j = 0; j < 10; j++) {
        const f = j / 10;
        
        // Görseldeki birebir RGB formülü: (1 - 0.6*f, 0.7*(1-f), 0.8*(1-f))
        const r = Math.round((1 - 0.6 * f) * 255);
        const g = Math.round(0.7 * (1 - f) * 255);
        const b = Math.round(0.8 * (1 - f) * 255);

        ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;

        const startX = xo + (xi - xo) * f;
        const startY = yo + (yi - yo) * f;
        const endX = xo + (xi - xo) * (f + 0.1);
        const endY = yo + (yi - yo) * (f + 0.1);

        ctx.beginPath();
        ctx.moveTo(centerX + (startX / 16) * scale, centerY - (startY / 16) * scale);
        ctx.lineTo(centerX + (endX / 16) * scale, centerY - (endY / 16) * scale);
        ctx.stroke();
      }

      i++;
      setTimeout(drawStep, 20);
    }

    drawStep();
  </script>
</body>
</html>
